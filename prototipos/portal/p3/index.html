<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P3 Esteira</title>
<style>
:root,.force-light{
  --bg:#f3f5f8;--surface:#ffffff;--fg:#12161c;--muted:#5a6575;--line:#dde2e9;--accent:#2f6df6;
  --plate:#e7ebf1;--plate-2:#d9dfe8;--edge:rgba(18,22,28,.26);--halo:#f3f5f8;
  --sh-l:11%;--sh-r:24%;--glow:0;
  --c-ocioso:#aab4c2;--c-trabalhando:#3b82f6;--c-aguardando:#f0a23a;--c-concluido:#2fb27a;--c-erro:#e5484d;
  --c-fila:#aab4c2;--c-andamento:#3b82f6;--c-validacao:#8b6cf0;--c-aprovada:#2fb27a;--c-devolvida:#f0a23a;--c-bloqueada:#e5484d;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f14;--surface:#141920;--fg:#e8ecf2;--muted:#8b96a6;--line:#252c37;--accent:#6ea0ff;
  --plate:#1b232d;--plate-2:#27313e;--edge:rgba(0,0,0,.55);--halo:#0c0f14;
  --sh-l:24%;--sh-r:42%;
  --c-ocioso:#58667a;--c-trabalhando:#5b9bff;--c-aguardando:#f5b04c;--c-concluido:#3fcf8e;--c-erro:#ff6369;
  --c-fila:#58667a;--c-andamento:#5b9bff;--c-validacao:#a18bff;--c-aprovada:#3fcf8e;--c-devolvida:#f5b04c;--c-bloqueada:#ff6369;
  color-scheme:dark;}}
:root[data-theme="dark"],.force-dark{
  --bg:#0c0f14;--surface:#141920;--fg:#e8ecf2;--muted:#8b96a6;--line:#252c37;--accent:#6ea0ff;
  --plate:#1b232d;--plate-2:#27313e;--edge:rgba(0,0,0,.55);--halo:#0c0f14;
  --sh-l:24%;--sh-r:42%;
  --c-ocioso:#58667a;--c-trabalhando:#5b9bff;--c-aguardando:#f5b04c;--c-concluido:#3fcf8e;--c-erro:#ff6369;
  --c-fila:#58667a;--c-andamento:#5b9bff;--c-validacao:#a18bff;--c-aprovada:#3fcf8e;--c-devolvida:#f5b04c;--c-bloqueada:#ff6369;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,.o:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand b{font-size:15px;letter-spacing:.01em}.brand span{color:var(--muted);margin-left:8px;font-size:13px}
.tot{display:flex;gap:18px;margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tot b{color:var(--fg);font-weight:600}
.ctl{display:flex;gap:6px;align-items:center}
.selo{font:600 11px var(--mono);letter-spacing:.08em;padding:4px 8px;border-radius:6px;border:1px dashed var(--muted);color:var(--muted)}
main{flex:1;display:grid;gap:16px;padding:16px 20px;align-items:start}
main.L-lado{grid-template-columns:minmax(0,1fr) 340px}
main.L-baixo{grid-template-columns:repeat(3,minmax(0,1fr))}
main.L-baixo .cena{grid-column:1/-1}
main.L-baixo .lado{display:contents}
.cena{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;position:relative}
.cena svg{display:block;width:100%;height:auto;max-height:calc(100vh - 150px)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px 6px;color:var(--muted);font-size:12px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lado{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ag-h{display:flex;gap:10px;align-items:flex-start}
.ag-h>div{flex:1;min-width:0}.ag-h b{display:block}.ag-h small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff;background:var(--fc);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--fc);margin-top:5px;flex:none}
.ativ{margin:10px 0;padding:8px 10px;border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.kv div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.kv dt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.l{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.l li{font-size:13px;min-width:0}
ul.l li[data-ag]{cursor:pointer}ul.l li[data-ag]:hover b{text-decoration:underline}
ul.l small{color:var(--muted)}
ul.pas li{font-family:var(--mono);font-size:12px;display:flex;gap:8px}
ul.pas li span{color:var(--muted);min-width:46px}ul.pas li.er{color:var(--c-erro)}
.a-ocioso{--fc:var(--c-ocioso)}.a-trabalhando{--fc:var(--c-trabalhando)}.a-aguardando{--fc:var(--c-aguardando)}.a-concluido{--fc:var(--c-concluido)}.a-erro{--fc:var(--c-erro)}
.t-fila{--fc:var(--c-fila)}.t-andamento{--fc:var(--c-andamento)}.t-validacao{--fc:var(--c-validacao)}.t-aprovada{--fc:var(--c-aprovada)}.t-devolvida{--fc:var(--c-devolvida)}.t-bloqueada{--fc:var(--c-bloqueada)}
/* cena */
.bx .t{fill:var(--fc,var(--plate))}
.bx .l{fill:color-mix(in srgb,var(--fc,var(--plate)),#000 var(--sh-l))}
.bx .r{fill:color-mix(in srgb,var(--fc,var(--plate)),#000 var(--sh-r))}
.bx polygon{stroke:var(--edge);stroke-width:1;stroke-linejoin:round}
.pl{--fc:var(--plate)}.pl2{--fc:var(--plate-2)}
.bx.wire polygon{fill:var(--surface);fill-opacity:.6;stroke:var(--fc,var(--muted));stroke-width:1.6}
.led.on{fill:var(--fc)}.led.off{fill:var(--plate)}.vent{stroke:var(--edge);stroke-width:1.5}
.lk{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4}
.o{cursor:pointer}
.o:hover .t{filter:brightness(1.07)}
.o.sel .t{stroke:var(--accent);stroke-width:2.4}
.o.sel .lab{fill:var(--accent)}
.lab{font:600 12.5px var(--sans);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.sub{font:11px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.cap{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;fill:var(--muted)}
.cx{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.cx.on{stroke:var(--accent);stroke-dasharray:3 7;animation:fluxo 1.2s linear infinite}
.trk{fill:none;stroke:var(--plate-2);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.ring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6}
.pkt{fill:var(--accent)}
.soft{fill:var(--plate);stroke:var(--line)}
.mon .t,.mon .r{fill:#2b3441}
.mon .l{fill:var(--fc)}
.a-trabalhando .mon .l{animation:pulso 1.8s ease-in-out infinite}
.num{font:700 10.5px var(--mono);fill:var(--fg);pointer-events:none}
.pill{fill:var(--surface);stroke:var(--fc,var(--muted));stroke-width:2}
.shadow{fill:var(--fg);opacity:.08}
.a-trabalhando .t{animation:pulso 1.8s ease-in-out infinite}
.fl{animation:flutua 4s ease-in-out infinite}
@keyframes pulso{50%{filter:brightness(1.14)}}
@keyframes fluxo{to{stroke-dashoffset:-20}}
@keyframes flutua{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.a-trabalhando .t,.cx.on,.fl{animation:none}}
@media (max-width:980px){main.L-lado,main.L-baixo{grid-template-columns:1fr}.tot{margin-left:0;width:100%}}
</style>

  `<g class="o t-${t.estado}${SEL === t.dono ? ' sel' : ''}"${chk ? ` data-obj="${esc(t.id)}"` : ''} data-ag="${esc(t.dono)}" tabindex="0" role="button" aria-label="Tarefa ${esc(t.id)}, ${EST_TA[t.estado]}">${inner}</g>`;
const pintar = (itens) => itens.sort((a, b) => a.k - b.k).map((i) => i.s).join('');
const falasRecentes = (n = 3) => Q.falas.slice(-n);
const reduz = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
// Ponto dourado que corre por um caminho (fala em curso).
const pacote = (d, dur = 2.4) => reduz() ? '' : `<circle class="pkt" r="4"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></circle>`;

// ---------------------------------------------------------------- painéis
function cabecalho() {
  const t = Q.totais || {};
  $('#tot').innerHTML = `<span>ativos <b>${t.agentesAtivos ?? 0}</b></span><span>entrada <b>${fmt(t.tokensEntrada)}</b></span><span>saída <b>${fmt(t.tokensSaida)}</b></span><span>cache <b>${fmt(t.tokensCache)}</b></span><span>quadro <b>${IDX + 1}/${DADOS.quadros.length}</b></span>`;
  $('#leg').innerHTML = Object.entries(EST_AG).map(([k, v]) => `<span><i style="background:var(--c-${k})"></i>${v}</span>`).join('')
    + '<span style="margin-left:auto">tarefas:</span>' + Object.entries(EST_TA).map(([k, v]) => `<span><i style="background:var(--c-${k})"></i>${v}</span>`).join('');
}
function painel() {
  const a = agente(SEL) || Q.agentes[0];
  const passos = (DADOS.detalhes?.[a.id]?.passos || []).slice(-4);
  $('#det').innerHTML = `<h2>Agente</h2>
    <div class="ag-h a-${a.estado}"><span class="dot"></span><div><b>${esc(nome(a.id))}</b><small>${esc(a.descricao)}</small></div><span class="chip">${EST_AG[a.estado]}</span></div>
    <p class="ativ">${esc(a.atividade)}</p>
    <dl class="kv">
      <div><dt>Modelo</dt><dd>${esc(a.modelo)}</dd></div><div><dt>Ferramentas</dt><dd>${a.ferramentas}</dd></div><div><dt>Erros</dt><dd>${a.erros}</dd></div>
      <div><dt>Entrada</dt><dd>${fmt(a.tokens.entrada)}</dd></div><div><dt>Saída</dt><dd>${fmt(a.tokens.saida)}</dd></div><div><dt>Cache</dt><dd>${fmt(a.tokens.cache)}</dd></div>
    </dl>
    ${passos.length ? '<ul class="l pas" style="margin-top:12px">' + passos.map((p) => `<li class="${p.erro ? 'er' : ''}"><span>${esc(p.ferramenta || p.tipo)}</span>${esc(p.resumo)}</li>`).join('') + '</ul>' : ''}`;
  $('#tar').innerHTML = '<h2>Tarefas</h2><ul class="l">' + (Q.tarefas.map((t) =>
    `<li data-ag="${esc(t.dono)}"><span class="chip t-${t.estado}">${EST_TA[t.estado]}</span> <b>${esc(t.id)}</b> ${esc(t.titulo)}<br><small>${esc(nome(t.dono))}${t.devolucoes ? ` · ${t.devolucoes} devolução(ões)` : ''}</small></li>`).join('') || '<li><small>sem tarefas</small></li>') + '</ul>';
  $('#fal').innerHTML = '<h2>Comunicação</h2><ul class="l">' + (Q.falas.slice(-8).reverse().map((f) =>
    `<li><small>${hora(f.ts)}</small> <b>${esc(nome(f.de))}</b> → <b>${esc(nome(f.para))}</b><br>${esc(f.texto)}</li>`).join('') || '<li><small>sem mensagens</small></li>') + '</ul>';
}
function desenhar(foco) {
  $('#cena').innerHTML = CENA.fn(Q);
  cabecalho(); painel();
  if (foco) $(`#cena [data-ag="${SEL}"]`)?.focus();
}
function quadro(i) { IDX = (i + DADOS.quadros.length) % DADOS.quadros.length; Q = DADOS.quadros[IDX]; desenhar(); }
function ciclo() { clearTimeout(TIMER); if (AUTO) TIMER = setTimeout(() => { quadro(IDX + 1); ciclo(); }, DADOS.intervaloMs || 3500); }

// ---------------------------------------------------------------- tema
function lerTema() { try { const v = localStorage.getItem('proto:tema'); return TEMAS.includes(v) ? v : 'sistema'; } catch { return 'sistema'; } }
function aplicarTema(m) {
  const r = document.documentElement;
  if (m === 'claro') r.setAttribute('data-theme', 'light'); else if (m === 'escuro') r.setAttribute('data-theme', 'dark'); else r.removeAttribute('data-theme');
  $('#tema').textContent = 'Tema: ' + m;
}

// ---------------------------------------------------------------- verificador de sobreposição (SAT entre polígonos convexos)
function formas(g) {
  const out = [];
  g.querySelectorAll('polygon,text,ellipse,circle,rect').forEach((e) => {
    if (e.closest('[data-ign]')) return;
    if (e.tagName === 'polygon') out.push(e.getAttribute('points').trim().split(/\s+/).map((p) => p.split(',').map(Number)));
    else { const b = e.getBBox(); out.push([[b.x, b.y], [b.x + b.width, b.y], [b.x + b.width, b.y + b.height], [b.x, b.y + b.height]]); }
  });
  return out;
}
function proj(p, ax) { let mn = 1e9, mx = -1e9; for (const [x, y] of p) { const v = x * ax[0] + y * ax[1]; if (v < mn) mn = v; if (v > mx) mx = v; } return [mn, mx]; }
function sat(a, b) {
  for (const P of [a, b]) for (let i = 0; i < P.length; i++) {
    const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length];
    const l = Math.hypot(y1 - y2, x2 - x1) || 1, ax = [(y1 - y2) / l, (x2 - x1) / l];
    const [a1, a2] = proj(a, ax), [b1, b2] = proj(b, ax);
    if (a2 <= b1 + 1 || b2 <= a1 + 1) return false;
  }
  return true;
}
function checar() {
  const falhas = [], guarda = [Q, IDX];
  const svg = $('#cena'), vb = svg.viewBox.baseVal;
  DADOS.quadros.forEach((q, qi) => {
    Q = q; svg.innerHTML = CENA.fn(q);
    const os = [...svg.querySelectorAll('[data-obj]')].map((g) => ({ id: g.dataset.obj, f: formas(g) }));
    for (const o of os) for (const f of o.f) for (const [x, y] of f)
      if (x < -1 || y < -1 || x > vb.width + 1 || y > vb.height + 1) { falhas.push(`q${qi}: ${o.id} fora do viewBox`); break; }
    for (let i = 0; i < os.length; i++) for (let j = i + 1; j < os.length; j++)
      if (os[i].f.some((a) => os[j].f.some((b) => sat(a, b)))) falhas.push(`q${qi}: ${os[i].id} x ${os[j].id}`);
  });
  [Q, IDX] = guarda; desenhar();
  return [...new Set(falhas)];
}

function iniciar() {
  const qs = new URLSearchParams(location.search);
  $('#cena').setAttribute('viewBox', `0 0 ${CENA.vb[0]} ${CENA.vb[1]}`);
  aplicarTema(qs.get('tema') === 'escuro' ? (document.documentElement.setAttribute('data-theme', 'dark'), 'escuro') : qs.get('tema') === 'claro' ? (document.documentElement.setAttribute('data-theme', 'light'), 'claro') : lerTema());
  if (qs.get('q')) { IDX = +qs.get('q') % DADOS.quadros.length; Q = DADOS.quadros[IDX]; }
  if (qs.get('sel')) SEL = qs.get('sel');
  if (qs.get('auto') === '0') AUTO = false;
  $('#auto').textContent = AUTO ? 'Pausar' : 'Retomar'; $('#auto').setAttribute('aria-pressed', String(AUTO));
  desenhar(); ciclo();
  document.addEventListener('click', (e) => { const t = e.target.closest?.('[data-ag]'); if (t) { SEL = t.dataset.ag; desenhar(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest?.('[data-ag][role="button"]'); if (t) { e.preventDefault(); SEL = t.dataset.ag; desenhar(true); }
  });
  $('#ant').onclick = () => quadro(IDX - 1);
  $('#prox').onclick = () => quadro(IDX + 1);
  $('#auto').onclick = () => { AUTO = !AUTO; $('#auto').textContent = AUTO ? 'Pausar' : 'Retomar'; $('#auto').setAttribute('aria-pressed', String(AUTO)); ciclo(); };
  $('#tema').onclick = () => { const m = TEMAS[(TEMAS.indexOf(lerTema()) + 1) % 3]; try { localStorage.setItem('proto:tema', m); } catch { /* sem storage */ } aplicarTema(m); };
  if (qs.has('checar')) {
    const f = checar(), pre = document.createElement('pre');
    pre.id = 'resultado-checar'; pre.textContent = JSON.stringify({ falhas: f }); document.body.appendChild(pre);
  }
}

const I = mk({ x: 0, y: 0, tw: 64, th: 32 });
const ET = ['fila', 'andamento', 'validacao', 'devolvida', 'aprovada', 'bloqueada'];
CENA = { vb: [1000, 620], fn(q) {
  let s = `<text class="cap" x="28" y="64">Tarefas por etapa</text><text class="cap" x="28" y="364">Agentes</text>`;
  ET.forEach((e, i) => {
    const cx = 100 + i * 160, cy = 235, ts = q.tarefas.filter((t) => t.estado === e);
    if (i) s += `<path d="M${cx - 88},${cy - 7} l11,7 l-11,7z" fill="var(--muted)" opacity=".55"/>`;
    const [gx, gy] = I.S(cx, cy);
    let g = boxAt(I, cx, cy, 2.2, 2.2, 8, 'pl2');
    ts.slice(0, 4).forEach((t, k) => {
      g += objT(t, box(I, gx - 1.1 + .15 + (k % 2) * 1.3, gy - 1.1 + .15 + Math.floor(k / 2) * 1.3, 8, .6, .6, 16, `t-${t.estado}`), false);
    });
    g += txt(cx, cy + 58, EST_TA[e], `${ts.length} tarefa(s)`);
    s += `<g data-obj="etapa-${e}" class="t-${e}">${g}</g>`;
  });
  q.agentes.forEach((a, i) => {
    const cx = 125 + i * 150, cy = 470;
    s += obj(a.id, boxAt(I, cx, cy, 1.6, 1.6, 3, 'pl') + boxAt(I, cx, cy, .8, .8, 28, '', 3) + txt(cx, cy + 48, nome(a.id), EST_AG[a.estado]));
  });
  return s;
} };

iniciar();
</script>
