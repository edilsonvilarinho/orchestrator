<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PE7 · Escritório isométrico dos agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Stencil+Display:wght@600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="/portal/tokens.css">
<style>
/* PE2 · Isométrico em tela única, revisão PE6: uma mesa por agente. Cores só por token; faces dos volumes por color-mix com --shade. */
:root{--p2-gut:max(14px,env(safe-area-inset-left),env(safe-area-inset-right))}
/* Cena: valores do tema claro. O tema escuro sobe piso, paredes e contornos pelos tokens --sc-* (só a cena muda). */
:root{
  --p2-scene-bg:var(--surface);
  --p2-floor:var(--paper-2);--p2-floor-edge:var(--line);--p2-grid:var(--rule);
  --p2-wall-r:color-mix(in srgb,var(--paper) 86%,var(--shade));
  --p2-wall-l:color-mix(in srgb,var(--paper) 74%,var(--shade));
  --p2-wall-edge:var(--line);
  --p2-edge:var(--ink);--p2-edge-op:.45;--p2-obj-edge:var(--ink-muted);
  --p2-mono-t:color-mix(in srgb,var(--shade) 80%,var(--clip));--p2-mono-l:color-mix(in srgb,var(--shade) 92%,var(--clip));--p2-mono-r:var(--shade);
  --p2-chair:color-mix(in srgb,var(--ink-muted) 80%,var(--shade));--p2-chair-edge:var(--ink);--p2-chair-op:.4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --p2-scene-bg:var(--sc-bg);
    --p2-floor:color-mix(in srgb,var(--sc-floor) 60%,var(--sc-shelf));--p2-floor-edge:var(--sc-edge);--p2-grid:color-mix(in srgb,var(--sc-floor) 35%,var(--sc-shelf));
    --p2-wall-r:color-mix(in srgb,var(--sc-floor) 33%,var(--sc-shelf));
    --p2-wall-l:color-mix(in srgb,var(--sc-floor) 45%,var(--sc-shelf));
    --p2-wall-edge:var(--sc-edge);
    --p2-edge:var(--sc-edge);--p2-edge-op:1;--p2-obj-edge:var(--sc-edge);
    --p2-mono-t:color-mix(in srgb,var(--sc-mono) 55%,var(--sc-edge));--p2-mono-l:color-mix(in srgb,var(--sc-mono) 88%,var(--sc-edge));--p2-mono-r:var(--sc-mono);
    --p2-chair:color-mix(in srgb,var(--sc-shelf) 55%,var(--sc-mono));--p2-chair-edge:var(--sc-edge);--p2-chair-op:1;
  }
}
:root[data-theme="dark"]{
  --p2-scene-bg:var(--sc-bg);
  --p2-floor:color-mix(in srgb,var(--sc-floor) 60%,var(--sc-shelf));--p2-floor-edge:var(--sc-edge);--p2-grid:color-mix(in srgb,var(--sc-floor) 35%,var(--sc-shelf));
  --p2-wall-r:color-mix(in srgb,var(--sc-floor) 33%,var(--sc-shelf));
  --p2-wall-l:color-mix(in srgb,var(--sc-floor) 45%,var(--sc-shelf));
  --p2-wall-edge:var(--sc-edge);
  --p2-edge:var(--sc-edge);--p2-edge-op:1;--p2-obj-edge:var(--sc-edge);
  --p2-mono-t:color-mix(in srgb,var(--sc-mono) 55%,var(--sc-edge));--p2-mono-l:color-mix(in srgb,var(--sc-mono) 88%,var(--sc-edge));--p2-mono-r:var(--sc-mono);
  --p2-chair:color-mix(in srgb,var(--sc-shelf) 55%,var(--sc-mono));--p2-chair-edge:var(--sc-edge);--p2-chair-op:1;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:15px;line-height:1.5;min-width:0;overflow-x:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--signal);outline-offset:2px}
.p2-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.p2-tid{font:700 1em/inherit var(--body)}

/* ---------- cabeçalho: uma linha ---------- */
.p2-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px var(--p2-gut);border-bottom:2px solid var(--manila);background:var(--bg);min-width:0}
.p2-brand{margin:0;flex:none;font:600 clamp(17px,1.5vw,26px)/1 var(--stencil);letter-spacing:.1em;text-transform:uppercase;color:var(--signal);white-space:nowrap}
.p2-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0;font:400 12px/1.2 var(--body);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.p2-chip{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:var(--r-xs);background:var(--surface);color:var(--fg);font:400 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase}
.p2-chip[data-modo="replay"]{border-color:var(--carbon);color:var(--carbon)}
.p2-btn{padding:6px 12px;background:var(--surface);color:var(--fg);border:2px solid var(--fg);border-radius:var(--r-sm);font:400 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--stamp);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.p2-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--stamp)}
.p2-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--stamp)}
.p2-head .p2-btn{flex:none}

/* totais no cabeçalho */
.p2-totals{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 0 auto;padding:0;min-width:0}
.p2-total{display:flex;align-items:baseline;gap:5px;padding:3px 7px;background:var(--paper);border:1px solid var(--sheet-edge);border-left:4px solid var(--manila);border-radius:var(--r-xs);white-space:nowrap}
.p2-total dt{font:400 11px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.p2-total dd{margin:0;font:400 14px/1.1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.p2-total--ativos dd{color:var(--carbon)}

/* ---------- layout ---------- */
.p2-main{display:grid;gap:14px;padding:14px var(--p2-gut) 40px;grid-template-columns:minmax(0,1fr)}
.p2-main>*{min-width:0}
.p2-side{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.p2-side>*{min-width:0}
.p2-h2{margin:0 0 8px;font:600 18px/1.1 var(--stencil);letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.p2-h2 span{font:400 13px/1 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);margin-left:8px}

/* ---------- cena ---------- */
.p2-stage{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.p2-scenewrap{position:relative;height:min(45svh,520px);background:var(--p2-scene-bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.p2-scene{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:hidden}
.p2-world *{vector-effect:non-scaling-stroke}
.p2-world .p2-fly,.p2-world .p2-fly *,.p2-world .p2-trail{vector-effect:none}

.p2-floor{fill:var(--p2-floor);stroke:var(--p2-floor-edge);stroke-width:2}
.p2-gridline{stroke:var(--p2-grid);stroke-width:1;fill:none}
.p2-wall-r{fill:var(--p2-wall-r);stroke:var(--p2-wall-edge);stroke-width:2}
.p2-wall-l{fill:var(--p2-wall-l);stroke:var(--p2-wall-edge);stroke-width:2}
.p2-skirt{fill:color-mix(in srgb,var(--manila) 70%,var(--shade))}
.p2-window{fill:color-mix(in srgb,var(--carbon) 16%,var(--paper));stroke:var(--p2-obj-edge);stroke-width:2}
.p2-windowbar{stroke:var(--p2-obj-edge);stroke-width:2}
.p2-drawer{fill:color-mix(in srgb,var(--manila) 55%,var(--paper));stroke:var(--p2-obj-edge);stroke-width:1.5}
.p2-clock{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.p2-clockhand{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.p2-rug{fill:color-mix(in srgb,var(--stamp) 14%,var(--paper-2));stroke:var(--stamp);stroke-width:2;stroke-dasharray:10 7}

/* tons das caixas */
.p2-box polygon{stroke:var(--p2-edge);stroke-opacity:var(--p2-edge-op);stroke-width:1.2;stroke-linejoin:round}
.p2-f-t{fill:var(--top)}.p2-f-l{fill:var(--lft)}.p2-f-r{fill:var(--rgt)}
.p2-t-wood{--top:var(--manila);--lft:color-mix(in srgb,var(--manila) 78%,var(--shade));--rgt:color-mix(in srgb,var(--manila) 58%,var(--shade))}
.p2-t-paper{--top:var(--paper);--lft:color-mix(in srgb,var(--paper) 84%,var(--shade));--rgt:color-mix(in srgb,var(--paper) 66%,var(--shade))}
.p2-t-steel{--top:var(--clip);--lft:color-mix(in srgb,var(--clip) 80%,var(--shade));--rgt:color-mix(in srgb,var(--clip) 60%,var(--shade))}
.p2-t-ink{--top:var(--ink-muted);--lft:color-mix(in srgb,var(--ink-muted) 78%,var(--shade));--rgt:color-mix(in srgb,var(--ink-muted) 58%,var(--shade))}
.p2-t-stamp{--top:var(--stamp);--lft:color-mix(in srgb,var(--stamp) 78%,var(--shade));--rgt:color-mix(in srgb,var(--stamp) 58%,var(--shade))}
.p2-t-carbon{--top:var(--carbon);--lft:color-mix(in srgb,var(--carbon) 78%,var(--shade));--rgt:color-mix(in srgb,var(--carbon) 58%,var(--shade))}
.p2-t-mono{--top:var(--p2-mono-t);--lft:var(--p2-mono-l);--rgt:var(--p2-mono-r)}

/* mesas */
.p2-seat{cursor:pointer}
.p2-shadow{fill:var(--shade);fill-opacity:.2}
.p2-chair{fill:var(--p2-chair);stroke:var(--p2-chair-edge);stroke-opacity:var(--p2-chair-op);stroke-width:1.2}

/* monólito: preto, com monograma e faixa de luz */
.p2-mono-d{fill:var(--manila);font:600 28px var(--stencil);letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
.p2-band{fill:var(--ink-muted);fill-opacity:.45}
.p2-bandglow{fill:var(--signal);fill-opacity:0}
.p2-seat[data-estado="trabalhando"] .p2-band,.p2-seat[data-estado="aguardando"] .p2-band,.p2-seat[data-estado="erro"] .p2-band{fill:var(--signal);fill-opacity:1}
.p2-seat[data-estado="trabalhando"] .p2-bandglow,.p2-seat[data-estado="aguardando"] .p2-bandglow,.p2-seat[data-estado="erro"] .p2-bandglow{fill-opacity:.32}
.p2-seat[data-estado="aguardando"] .p2-band{fill-opacity:.7}

/* luminária de estado: acesa quando o posto está ativo */
.p2-bulb{fill:var(--paper);stroke:var(--ink);stroke-opacity:.5}
.p2-halo{fill:var(--manila);fill-opacity:.5;stroke:none;display:none}
.p2-seat[data-estado="trabalhando"] .p2-halo,.p2-seat[data-estado="aguardando"] .p2-halo,.p2-seat[data-estado="erro"] .p2-halo{display:inline}
.p2-seat[data-estado="trabalhando"] .p2-bulb,.p2-seat[data-estado="aguardando"] .p2-bulb{fill:var(--manila)}
.p2-seat[data-estado="erro"] .p2-bulb{fill:var(--stamp)}
.p2-seat[data-estado="erro"] .p2-halo{fill:var(--stamp);fill-opacity:.35}

/* pastas abertas: uma por execução ativa, até quatro */
.p2-pasta.is-off{display:none}
.p2-pasta-sheet{fill:var(--paper)}

/* marcador de estado: forma + cor; o texto vai no rótulo */
.p2-marker-plate{fill:var(--paper);stroke:currentColor;stroke-width:3}
.p2-marker{color:var(--ink-muted)}
.p2-seat[data-estado="trabalhando"] .p2-marker{color:var(--carbon)}
.p2-seat[data-estado="aguardando"] .p2-marker{color:var(--ink)}
.p2-seat[data-estado="concluido"] .p2-marker{color:var(--ink)}
.p2-seat[data-estado="erro"] .p2-marker{color:var(--stamp)}
.p2-ring{fill:none;stroke:var(--stamp);stroke-width:4;stroke-dasharray:8 6;opacity:0;pointer-events:none}
.p2-ring.is-recebe{opacity:1}
.p2-slam{display:none}
.p2-seat.is-devolvido .p2-slam,.p2-seat.has-devolucao .p2-slam,.p2-seat.p2-measure .p2-slam{display:inline}
.p2-slam rect{fill:var(--paper);fill-opacity:.9;stroke:var(--stamp);stroke-width:4;rx:5}
.p2-slam text{fill:var(--stamp);font:400 22px var(--display);letter-spacing:.1em;text-anchor:middle;dominant-baseline:central}
.p2-main[data-modo="compacto"] .p2-slam{display:none!important}
.p2-prop-ring{fill:none;stroke:var(--ink);stroke-width:2.5}
.p2-prop-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.p2-prop-shade{fill:var(--manila);stroke:var(--ink);stroke-opacity:.5;stroke-width:1.2}
.p2-prop-bulb{fill:var(--paper);stroke:var(--ink);stroke-opacity:.5}

/* ---------- rótulos de mesa: camada HTML em pixels fixos, posicionada sem tocar nas mesas ---------- */
.p2-labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.p2-leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.p2-leaders line{stroke:var(--ink-muted);stroke-width:1.5;stroke-dasharray:3 3}
.p2-lbl{display:flex;flex-direction:column;width:100%;text-align:left;padding:4px 8px;background:var(--paper);color:var(--ink);border:1px solid var(--ink-muted);border-left:6px solid var(--ink-muted);border-radius:var(--r-xs);cursor:pointer;box-shadow:0 2px 0 var(--shadow),0 4px 10px var(--shadow-soft);min-width:0;overflow:hidden;font:400 14px/1.2 var(--body)}
.p2-lbl[data-estado="trabalhando"]{border-left-color:var(--carbon)}
.p2-lbl[data-estado="erro"]{border-left-color:var(--stamp);border-color:var(--stamp)}
.p2-lbl[data-estado="aguardando"]{border-left-style:double;border-left-width:7px;border-left-color:var(--ink)}
.p2-lbl[data-estado="concluido"]{border-left-style:dashed;border-left-color:var(--ink-muted)}
.p2-lbl--cena{position:absolute;pointer-events:auto}
.p2-lbl--cena[hidden]{display:none}
.p2-lbl>*{flex:none}
.p2-lbl [hidden]{display:none!important}
.p2-lbl__hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.p2-lbl__nome{flex:none;font:400 15px/1.2 var(--display);color:var(--ink);white-space:nowrap}
.p2-lbl__mod{min-width:0;font:400 14px/1.2 var(--body);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p2-st{display:flex;align-items:center;gap:6px;font:400 14px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);min-width:0}
.p2-st svg{flex:none;width:15px;height:15px}
.p2-st[data-estado="trabalhando"]{color:var(--carbon)}
.p2-st[data-estado="erro"]{color:var(--stamp)}
.p2-st[data-estado="ocioso"],.p2-st[data-estado="concluido"]{color:var(--ink-muted)}
.p2-lbl__cnt{display:block;font:400 14px/1.2 var(--body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p2-lbl__ativ{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:400 14px/1.2 var(--body);color:var(--ink);overflow-wrap:anywhere;min-height:2.4em}
.p2-lbl__tar{display:block;font:400 14px/1.2 var(--body);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p2-tk{display:block;margin-top:3px;font:400 13px/1.3 var(--body);color:var(--ink-muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* voo de objetos */
.p2-fly{pointer-events:none}
.p2-fly__pasta{fill:var(--manila);stroke:var(--ink);stroke-opacity:.7;stroke-width:1.6;stroke-linejoin:round}
.p2-fly__linha{fill:none;stroke:var(--manila-ink);stroke-width:1.6;stroke-linecap:round}
.p2-fly__memo{fill:var(--paper);stroke:var(--ink);stroke-opacity:.7;stroke-width:1.6}
.p2-fly__clip{fill:none;stroke:var(--clip);stroke-width:3;stroke-linecap:round}
.p2-fly__dev{fill:var(--stamp);stroke:var(--ink);stroke-opacity:.8;stroke-width:2;stroke-linejoin:round}
.p2-fly__devtag{fill:var(--paper);stroke:var(--ink);stroke-opacity:.8;stroke-width:1.5}
.p2-fly__devtxt{fill:var(--stamp);font:400 11px var(--display);letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
.p2-fly__sealA{fill:var(--paper);stroke:var(--carbon);stroke-width:3}
.p2-fly__sealB{fill:var(--carbon)}
.p2-fly__env{fill:var(--paper);stroke:var(--ink);stroke-opacity:.7;stroke-width:1.6;stroke-linejoin:round}
.p2-trail{fill:none;stroke:var(--stamp);stroke-width:calc(4px * var(--p2-inv,1));stroke-dasharray:14 10;stroke-linecap:round;opacity:.9}

/* balão: HTML em pixels fixos */
.p2-balloons{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.p2-balloon{position:absolute;width:260px}
.p2-balloon__in{padding:7px 10px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r-sm);box-shadow:3px 3px 0 var(--ink-muted)}
.p2-balloon[data-tipo="devolucao"] .p2-balloon__in{border-color:var(--stamp);border-width:4px;box-shadow:5px 5px 0 var(--stamp)}
.p2-balloon[data-tipo="retorno"] .p2-balloon__in{border-style:dashed}
.p2-balloon[data-tipo="veredito"] .p2-balloon__in{border-style:double;border-width:5px;border-color:var(--carbon)}
.p2-balloon__h{display:block;font:400 14px/1.2 var(--body);color:var(--stamp)}
.p2-balloon__t{display:-webkit-box;-webkit-line-clamp:5;line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin:3px 0 0;font:400 14px/1.3 var(--serif);overflow-wrap:anywhere}

/* faixa de devolução, impossível de perder */
.p2-devo{position:absolute;left:50%;top:12px;z-index:5;max-width:calc(100% - 28px);transform:translateX(-50%) rotate(-2deg);padding:6px 14px 8px;background:var(--paper);color:var(--stamp);border:5px solid var(--stamp);border-radius:var(--r-xs);box-shadow:6px 6px 0 var(--stamp);text-align:center;pointer-events:none}
.p2-devo[hidden]{display:none}
.p2-devo__t{display:block;font:400 clamp(22px,3vw,34px)/1 var(--display);letter-spacing:.14em;text-transform:uppercase;mix-blend-mode:var(--stamp-blend)}
.p2-devo__d{display:block;margin-top:4px;font:400 13px/1.3 var(--body);color:var(--ink);overflow-wrap:anywhere}

/* lista de postos (cena compacta) */
.p2-rosterwrap{display:none}
.p2-main[data-modo="compacto"] .p2-rosterwrap{display:block}
.p2-roster{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.p2-roster .p2-lbl{position:static;height:auto;overflow:visible;padding:4px 9px}
.p2-roster .p2-lbl__nome{white-space:normal}
.p2-roster .p2-lbl__tar{white-space:normal}
.p2-roster .p2-lbl__ativ{-webkit-line-clamp:3;line-clamp:3}

/* fita de telex: a última fala, numa linha */
.p2-telex{display:none;position:relative;margin:0;padding:9px 14px;list-style:none;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-sm);font:400 13px/1.3 var(--body);color:var(--ink);min-width:0}
.p2-telex::before,.p2-telex::after{content:"";position:absolute;left:0;right:0;height:6px;background:radial-gradient(circle,var(--bg) 1.8px,var(--paper-2) 2.4px) 0 0/12px 6px repeat-x}
.p2-telex::before{top:1px}.p2-telex::after{bottom:1px}
.p2-telex li{display:flex;gap:8px;min-width:0}
.p2-telex li>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p2-telex time{flex:none;color:var(--stamp);font-variant-numeric:tabular-nums}
.p2-telex__vazio{color:var(--ink-muted)}
.p2-telex li.is-novo{background:var(--rule)}
.p2-telex li[data-tipo="devolucao"]{color:var(--stamp)}

/* ---------- quadro de tarefas ---------- */
.p2-boardwrap{display:flex;flex-direction:column;min-height:0}
.p2-board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));min-height:0}
.p2-col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-bottom:3px solid var(--manila);border-radius:var(--r-sm)}
.p2-col__hd{display:flex;justify-content:space-between;align-items:center;gap:4px;margin:0 0 6px;padding:5px 7px;background:var(--manila);color:var(--manila-ink);border-radius:var(--r-sm) var(--r-sm) 0 0;font:600 14px/1.1 var(--stencil);letter-spacing:.06em;text-transform:uppercase}
.p2-col[data-col="devolvida"] .p2-col__hd{background:var(--stamp);color:var(--paper)}
.p2-col__n{font:400 13px/1 var(--body)}
.p2-cards{list-style:none;margin:0;padding:0 5px 6px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;min-height:0}
.p2-card{padding:5px 7px;background:var(--paper);color:var(--ink);border:1px solid var(--sheet-edge);border-left:4px solid var(--manila);border-radius:var(--r-xs);box-shadow:0 1px 0 var(--shadow),0 3px 8px var(--shadow-soft);min-width:0;overflow-wrap:anywhere}
.p2-card__top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.p2-card__id{font:700 13px/1 var(--body);letter-spacing:.02em;color:var(--stamp);white-space:nowrap}
.p2-card__t{margin:2px 0 0;font:400 13px/1.25 var(--serif);display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p2-card__o{margin:3px 0 0;font:400 12px/1.25 var(--body);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p2-card__dev{display:inline-block;padding:0 4px;border:2px solid var(--ink-muted);border-radius:var(--r-xs);font:400 12px/1.3 var(--body);color:var(--ink-muted);white-space:nowrap}
.p2-card__dev[data-n="0"]{border-style:dashed}
.p2-card__dev:not([data-n="0"]){border-color:var(--stamp);color:var(--stamp)}
.p2-empty{margin:0;padding:4px 8px;font:italic 400 12.5px/1.3 var(--serif);color:var(--muted)}
.p2-aprov{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-bottom:3px solid var(--manila);border-radius:var(--r-sm)}
.p2-aprov>summary{cursor:pointer;padding:5px 9px;font:600 14px/1.2 var(--stencil);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);list-style:none;display:flex;align-items:center;gap:8px}
.p2-aprov>summary::-webkit-details-marker{display:none}
.p2-aprov>summary::before{content:"+";display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:2px solid var(--ink-muted);border-radius:var(--r-xs);font:400 14px/12px var(--body)}
.p2-aprov[open]>summary::before{content:"\2212"}
.p2-aprov .p2-cards{padding:0 6px 6px;max-height:min(30svh,260px);overflow:auto;overscroll-behavior:contain}

/* ---------- registro ---------- */
.p2-logwrap{display:flex;flex-direction:column;min-height:0}
.p2-logtools{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;margin:0 0 6px}
.p2-logtools label{font:400 13px/1 var(--body);color:var(--muted)}
.p2-select{flex:1 1 140px;min-width:0;padding:4px 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font:400 13px/1.2 var(--body)}
.p2-loglist{list-style:none;margin:0;padding:6px;max-height:60svh;overflow:auto;overflow-anchor:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;overscroll-behavior:contain;min-height:0}
.p2-loglist li[hidden]{display:none}
.p2-log{padding:4px 8px 5px;background:var(--paper);color:var(--ink);border:1px solid var(--sheet-edge);border-left:6px solid var(--manila);border-radius:var(--r-xs);min-width:0}
.p2-log[data-tipo="devolucao"]{border-left-color:var(--stamp);border:3px solid var(--stamp);background:var(--paper-2)}
.p2-log[data-tipo="retorno"]{border-left-style:dashed}
.p2-log[data-tipo="veredito"]{border-left-style:double;border-left-width:8px;border-left-color:var(--carbon)}
.p2-log__top{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font:400 13px/1.3 var(--body);color:var(--ink-muted)}
.p2-log__top time{color:var(--stamp);font-variant-numeric:tabular-nums}
.p2-tag{padding:0 5px;border:2px solid var(--ink);border-radius:var(--r-xs);font:400 13px/1.3 var(--body);color:var(--ink)}
.p2-log[data-tipo="devolucao"] .p2-tag{background:var(--stamp);border-color:var(--stamp);color:var(--paper)}
.p2-log[data-tipo="retorno"] .p2-tag{border-style:dashed}
.p2-log[data-tipo="veredito"] .p2-tag{border-color:var(--carbon);color:var(--carbon);border-style:double}
.p2-log[data-tipo="fala"] .p2-tag,.p2-log[data-tipo="atividade"] .p2-tag{border-style:dotted}
.p2-log__quem{min-width:0;font:400 13px/1.3 var(--body);color:var(--ink);overflow-wrap:anywhere}
.p2-log__txt{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;margin:2px 0 0;padding:0;background:none;border:0;border-radius:var(--r-xs);text-align:left;color:var(--ink);font:400 13px/1.3 var(--serif);overflow-wrap:anywhere;cursor:pointer}
.p2-log__txt[aria-expanded="true"]{display:block;overflow:visible}
.p2-log__txt:hover{background:var(--paper-2)}
.p2-log__rever{flex:none;margin-left:auto;padding:0 6px;background:var(--surface);border:1px dashed var(--ink-muted);border-radius:var(--r-xs);font:400 13px/1.35 var(--body);cursor:pointer;color:var(--ink)}

/* ---------- painel do posto ---------- */
.p2-dlg{width:min(780px,calc(100vw - 24px));max-height:min(88vh,900px);padding:0;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r);box-shadow:8px 8px 0 var(--stamp);overflow:auto;overscroll-behavior:contain}
.p2-dlg::backdrop{background:color-mix(in srgb,var(--bg) 72%,var(--shade))}
.p2-dlg__hd{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 16px;background:var(--manila);color:var(--manila-ink);border-bottom:2px solid var(--ink)}
.p2-dlg__tt{margin:0;font:600 24px/1.1 var(--stencil);letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.p2-dlg__sub{display:block;margin-top:4px;font:400 13px/1.3 var(--body)}
.p2-dlg__body{padding:14px 16px 20px;display:grid;gap:16px}
.p2-dlg h3{margin:0 0 6px;font:600 16px/1.1 var(--stencil);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp)}
.p2-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin:0}
.p2-kv div{min-width:0;padding:6px 8px;border:1px dashed var(--rule);border-radius:var(--r-xs)}
.p2-kv dt{font:400 12px/1.1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.p2-kv dd{margin:2px 0 0;font:400 14px/1.3 var(--body);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.p2-pre{margin:0;padding:10px 12px;max-height:260px;overflow:auto;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-xs);font:400 13px/1.45 var(--body);white-space:pre-wrap;overflow-wrap:anywhere}
.p2-steps{list-style:none;margin:0;padding:0;display:grid;gap:5px;max-height:320px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r-xs);padding:6px}
.p2-step{display:flex;flex-wrap:wrap;gap:3px 8px;padding:4px 6px;border-left:4px solid var(--rule);font:400 13px/1.35 var(--body);min-width:0}
.p2-step[data-erro="true"]{border-left-color:var(--stamp);border-left-width:6px;background:var(--paper-2)}
.p2-step time{color:var(--stamp);font-variant-numeric:tabular-nums}
.p2-step__k{font:400 13px/1.4 var(--body);text-transform:uppercase;color:var(--ink-muted)}
.p2-step__e{padding:0 5px;border:2px solid var(--stamp);border-radius:var(--r-xs);font:400 12px/1.4 var(--body);color:var(--stamp)}
.p2-step__r{flex:1 1 100%;min-width:0;overflow-wrap:anywhere}
.p2-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.p2-tools li{padding:2px 8px;border:1px solid var(--ink-muted);border-radius:var(--r-xs);font:400 13px/1.4 var(--body)}
.p2-note{margin:0;font:italic 400 14px/1.4 var(--serif);color:var(--ink-muted)}
.p2-execs{list-style:none;margin:0;padding:6px;display:grid;gap:6px;max-height:min(42vh,340px);overflow:auto;border:1px solid var(--rule);border-radius:var(--r-xs);overscroll-behavior:contain}
.p2-exec{display:grid;gap:2px;width:100%;text-align:left;padding:6px 10px;background:var(--paper-2);color:var(--ink);border:1px solid var(--ink-muted);border-left:6px solid var(--ink-muted);border-radius:var(--r-xs);cursor:pointer;font:400 14px/1.3 var(--body);min-width:0}
.p2-exec:hover{background:var(--surface)}
.p2-exec[data-estado="trabalhando"]{border-left-color:var(--carbon)}
.p2-exec[data-estado="erro"]{border-left-color:var(--stamp)}
.p2-exec[data-estado="aguardando"]{border-left-style:double;border-left-width:7px;border-left-color:var(--ink)}
.p2-exec[data-estado="concluido"]{border-left-style:dashed}
.p2-exec__d{overflow-wrap:anywhere}
.p2-exec__m{color:var(--ink-muted);font-size:13px;overflow-wrap:anywhere}

/* selo de dados de exemplo (cópia local, usada só quando o kit não carrega por file://) */
.p2-selo{position:fixed;right:12px;bottom:12px;z-index:2147483000;padding:6px 12px;font:600 14px/1 var(--stencil);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--stamp);border:2px solid var(--paper);border-radius:var(--r-xs);transform:rotate(-2deg);pointer-events:none}

/* ---------- tela única a partir de 1100 px ---------- */
@media (min-width:1100px){
  html,body{height:100%;overflow:hidden}
  body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
  .p2-head{flex-wrap:nowrap}
  .p2-meta{flex:none;flex-wrap:nowrap;white-space:nowrap}
  .p2-totals{flex-wrap:nowrap;flex:none}
  .p2-main{min-height:0;padding:12px var(--p2-gut);gap:12px;grid-template-columns:minmax(0,1fr) clamp(380px,36vw,520px);grid-template-rows:minmax(0,1fr)}
  .p2-stage{min-height:0}
  .p2-scenewrap{flex:1 1 0;height:auto;min-height:0}
  .p2-telex{display:block;flex:none}
  .p2-side{display:grid;grid-template-rows:minmax(0,60fr) minmax(0,40fr);gap:12px;min-height:0}
  .p2-side>*{min-height:0}
  .p2-board{flex:1 1 0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
  .p2-board:has(.p2-col[data-col="bloqueada"]){grid-template-columns:repeat(5,minmax(0,1fr))}
  .p2-col{overflow:hidden}
  .p2-cards{overflow:auto;flex:1 1 0;overscroll-behavior:contain}
  .p2-aprov .p2-cards{max-height:min(24svh,200px)}
  .p2-loglist{flex:1 1 0;max-height:none}
}
@media (min-width:1100px) and (max-width:1899.98px){
  .p2-meta .p2-meta__at{display:none}
}
@media (min-width:1100px) and (max-width:1599.98px){
  .p2-meta .p2-meta__ses{display:none}
  .p2-total__w{display:none}
}
@media (min-width:1100px) and (max-width:1259.98px){
  .p2-total--cache{display:none}
}
@media (min-width:1100px) and (max-width:1179.98px){
  .p2-meta{display:none}
}
@media (min-width:1100px) and (max-width:1339.98px){
  .p2-total dt{font-size:10px}
  .p2-head{gap:6px 10px}
  .p2-btn{padding:6px 9px}
}

/* ---------- movimento ---------- */
@media (prefers-reduced-motion:no-preference){
  .p2-seat[data-estado="trabalhando"] .p2-marker-plate{animation:p2-pulse 1.4s ease-in-out infinite alternate}
  .p2-seat[data-estado="trabalhando"] .p2-halo,.p2-seat[data-estado="erro"] .p2-halo{animation:p2-glow 1.2s ease-in-out infinite alternate}
  .p2-seat[data-estado="trabalhando"] .p2-bandglow{animation:p2-glow 1.2s ease-in-out infinite alternate}
  .p2-seat.is-devolvido .p2-slam{animation:p2-slam .45s var(--ease) both}
  .p2-ring.is-recebe{animation:p2-ring .8s ease-in-out infinite alternate}
  .p2-devo:not([hidden]){animation:p2-slam-devo .45s var(--ease) both}
  .p2-telex li.is-novo{animation:p2-fade .8s var(--ease) both}
}
@keyframes p2-glow{from{opacity:.55}to{opacity:1}}
@keyframes p2-pulse{from{stroke-width:3}to{stroke-width:6}}
@keyframes p2-ring{from{stroke-width:3}to{stroke-width:7}}
@keyframes p2-slam{0%{transform:scale(2.3);opacity:.1}70%{transform:scale(.94);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p2-slam-devo{0%{transform:translateX(-50%) rotate(-2deg) scale(1.8);opacity:.15}70%{transform:translateX(-50%) rotate(-2deg) scale(.96);opacity:1}100%{transform:translateX(-50%) rotate(-2deg) scale(1);opacity:1}}
@keyframes p2-fade{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

@media (min-width:641px){
  .p2-log__top{flex-wrap:nowrap}
  .p2-log__top>*{flex:none}
  .p2-log__top>.p2-log__quem{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (max-width:640px){
  .p2-head{gap:6px 10px}
  .p2-totals{margin-left:0}
  .p2-board{grid-template-columns:minmax(0,1fr)}
  .p2-devo{top:auto;bottom:8px;padding:4px 10px 5px;border-width:4px;box-shadow:4px 4px 0 var(--stamp)}
  .p2-devo__t{font-size:20px}
  .p2-devo__d{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p2-dlg__body{padding:12px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="p2-g-trabalhando" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 7.5l7 4.5-7 4.5z" fill="currentColor"/></symbol>
  <symbol id="p2-g-aguardando" viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 7h6l-3 5 3 5H9l3-5z" fill="currentColor"/></symbol>
  <symbol id="p2-g-concluido" viewBox="0 0 24 24"><path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M7 12.5l3.5 3.5L17 9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="p2-g-erro" viewBox="0 0 24 24"><path d="M12 2.5L22 20.5H2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 9v5.5M12 17v1.6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
  <symbol id="p2-g-ocioso" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3"/><path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</defs></svg>

<header class="p2-head">
  <h1 class="p2-brand" id="p2-brand">Escritório dos agentes</h1>
  <div class="p2-meta">
    <span class="p2-chip" id="p2-modo" data-modo="conectando">conectando</span>
    <span class="p2-meta__ses">sessão <span id="p2-sessao">—</span></span>
    <span class="p2-meta__at">atualizado <time id="p2-atualizado">—</time></span>
  </div>
  <dl class="p2-totals" aria-label="Totais da sessão">
    <div class="p2-total p2-total--ativos"><dt>Ativos</dt><dd id="p2-t-ativos">—</dd></div>
    <div class="p2-total"><dt>Execuções</dt><dd id="p2-t-exec">—</dd></div>
    <div class="p2-total"><dt><span class="p2-total__w">Tokens </span>entrada</dt><dd id="p2-t-ent">—</dd></div>
    <div class="p2-total"><dt>saída</dt><dd id="p2-t-sai">—</dd></div>
    <div class="p2-total p2-total--cache"><dt>cache</dt><dd id="p2-t-cac">—</dd></div>
  </dl>
  <button type="button" class="p2-btn" id="p2-tema" aria-label="Alternar tema: Sistema, Claro, Escuro">Tema: Sistema</button>
</header>

<main class="p2-main" id="p2-main" data-modo="normal">
  <section class="p2-stage" id="p2-stage" aria-labelledby="p2-h-cena">
    <h2 class="p2-sr" id="p2-h-cena">Escritório</h2>
    <div class="p2-scenewrap" id="p2-scenewrap">
      <svg class="p2-scene" id="p2-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="group" aria-label="Escritório isométrico: cada agente tem a própria mesa"></svg>
      <div class="p2-labels" id="p2-labels"></div>
      <div class="p2-balloons" id="p2-balloons"></div>
      <div class="p2-devo" id="p2-devo" hidden><span class="p2-devo__t">Devolução</span><span class="p2-devo__d" id="p2-devo-d"></span></div>
    </div>
    <ol class="p2-telex" id="p2-telex" aria-hidden="true"></ol>
  </section>

  <section class="p2-rosterwrap" aria-labelledby="p2-h-agentes">
    <h2 class="p2-h2" id="p2-h-agentes">Agentes</h2>
    <ul class="p2-roster" id="p2-roster"></ul>
  </section>

  <div class="p2-side">
    <section class="p2-boardwrap" aria-labelledby="p2-h-quadro">
      <h2 class="p2-h2" id="p2-h-quadro">Quadro de tarefas<span id="p2-n-tarefas"></span></h2>
      <div class="p2-board" id="p2-board"></div>
      <details class="p2-aprov" id="p2-aprov">
        <summary id="p2-aprov-n">Aprovadas · 0</summary>
        <ul class="p2-cards" id="p2-aprov-list"></ul>
      </details>
    </section>

    <section class="p2-logwrap" aria-labelledby="p2-h-log">
      <h2 class="p2-h2" id="p2-h-log">Registro de comunicação<span id="p2-n-falas"></span></h2>
      <div class="p2-logtools">
        <label for="p2-filtro">Filtrar</label>
        <select class="p2-select" id="p2-filtro"><option value="">Todos os agentes</option></select>
      </div>
      <ol class="p2-loglist" id="p2-log" aria-live="polite" aria-relevant="additions" aria-label="Falas, da mais recente para a mais antiga"></ol>
    </section>
  </div>
</main>

<dialog class="p2-dlg" id="p2-dlg" aria-labelledby="p2-dlg-tt">
  <div class="p2-dlg__hd">
    <div><h2 class="p2-dlg__tt" id="p2-dlg-tt">Agente</h2><span class="p2-dlg__sub" id="p2-dlg-sub"></span></div>
    <button type="button" class="p2-btn" id="p2-dlg-x">Fechar (Esc)</button>
  </div>
  <div class="p2-dlg__body" id="p2-dlg-body"></div>
</dialog>

<script type="module">
/* ============================================================ utilidades */
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
function se(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function he(tag, cls, text, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
const pad = (n) => String(n).padStart(2, '0');
const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');
const fmtC = (n) => Number(n || 0).toLocaleString('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
function dataBR(iso) {
  const d = new Date(iso); if (isNaN(d)) return '—';
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
}
function hora(iso) {
  const d = new Date(iso); if (isNaN(d)) return '—';
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/* ============================================================ postos: uma mesa por agente */
const POSTOS = [
  { tipo: 'am', nome: 'Direção', mono: 'AM' },
  { tipo: 'explorer', nome: 'Exploração', mono: 'EX' },
  { tipo: 'backend-dev', nome: 'Back-end', mono: 'BE' },
  { tipo: 'frontend-dev', nome: 'Front-end', mono: 'FE' },
  { tipo: 'prototype-dev', nome: 'Protótipos', mono: 'PR' },
  { tipo: 'test-runner', nome: 'Testes', mono: 'TS' },
];
const APOIO = { tipo: 'outro', nome: 'Apoio', mono: 'AP' };
const FIXOS = POSTOS.map((p) => p.tipo);
const INFO = Object.fromEntries([...POSTOS, APOIO].map((p) => [p.tipo, p]));
const PRIO = { erro: 4, trabalhando: 3, aguardando: 2, concluido: 1, ocioso: 0 };
const ATIVO = new Set(['erro', 'trabalhando', 'aguardando']);
const COLUNAS = [['fila', 'Fila'], ['andamento', 'Andamento'], ['validacao', 'Validação'], ['devolvida', 'Devolvida']];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tipoDe = (a) => (FIXOS.includes(a.tipo) ? a.tipo : 'outro');
const ultimo = (a) => String((a && (a.ultimoEvento || a.fim || a.inicio)) || '');

function montarPostos(agentes) {
  const grupos = new Map();
  for (const a of agentes) {
    const k = tipoDe(a);
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(a);
  }
  const porInicio = (x, y) => String(x.inicio || '').localeCompare(String(y.inicio || ''));
  const lista = POSTOS.map((p) => ({ ...p, execs: (grupos.get(p.tipo) || []).slice().sort(porInicio) }));
  if (grupos.has('outro')) lista.push({ ...APOIO, execs: grupos.get('outro').slice().sort(porInicio) });
  return lista;
}
/* resolve um agentId, tipo ou tipo original para o posto */
function postoDeRef(ref) {
  if (!ref) return 'am';
  if (app.execPosto.has(ref)) return app.execPosto.get(ref);
  if (FIXOS.includes(ref)) return ref;
  if (app.porOriginal.has(ref)) return app.porOriginal.get(ref);
  return null;
}
function nomeRef(ref) {
  const t = postoDeRef(ref);
  if (t) return INFO[t].nome;
  return /^[0-9a-f-]{12,}$|^a[0-9a-f]{12,}$/i.test(String(ref)) ? 'agente' : String(ref || '—');
}
function resumir(p, est) {
  let estado = 'ocioso', prio = -1, principal = null;
  for (const a of p.execs) {
    const q = PRIO[a.estado] ?? 0;
    if (q > prio || (q === prio && ultimo(a) > ultimo(principal))) { prio = q; principal = a; estado = a.estado; }
  }
  const ativas = p.execs.filter((a) => ATIVO.has(a.estado));
  const tok = p.execs.reduce((t, a) => ({ entrada: t.entrada + (a.tokens?.entrada || 0), saida: t.saida + (a.tokens?.saida || 0), cache: t.cache + (a.tokens?.cache || 0) }), { entrada: 0, saida: 0, cache: 0 });
  const recentes = p.execs.slice().sort((x, y) => ultimo(y).localeCompare(ultimo(x)));
  const modelo = (principal && principal.modelo) || (recentes.find((a) => a.modelo) || {}).modelo || null;
  const tarefas = new Set();
  for (const a of ativas) if (a.tarefa) tarefas.add(a.tarefa);
  let devolvida = false;
  for (const t of est.tarefas) {
    if (t.estado === 'aprovada' || postoDeRef(t.dono) !== p.tipo) continue;
    tarefas.add(t.id);
    if (t.estado === 'devolvida') devolvida = true;
  }
  const n = ativas.length, tot = p.execs.length;
  let contagem = 'sem execuções';
  if (n) contagem = `${n} em andamento`;
  else if (tot) contagem = p.execs.every((a) => a.estado === 'concluido') ? (tot === 1 ? '1 concluída' : `${tot} concluídas`) : `${tot} ${tot === 1 ? 'execução' : 'execuções'}`;
  return {
    estado, principal, ativas, tot, tok, modelo, tarefas: [...tarefas], devolvida, contagem,
    modeloCurto: modelo ? modelo.replace(/^claude-/, '') : 'sem modelo',
    atividade: principal ? (principal.atividade || '—') : 'sem atividade',
  };
}

/* ============================================================ geometria isométrica */
const S = 150;                       // meia-largura de uma célula
const KY = 0.6;                      // achatamento vertical
const SKEW = (Math.atan(KY) * 180 / Math.PI).toFixed(2);   // inclinação do plano da frente de uma caixa
const gx = (u, v) => (u - v) * S;
const gy = (u, v, z = 0) => (u + v) * S * KY - z;
const P = (u, v, z = 0) => [gx(u, v), gy(u, v, z)];
const ptsStr = (pts) => pts.map((p) => p.map((n) => Math.round(n * 10) / 10).join(',')).join(' ');
function poly(parent, pts, cls) { return se('polygon', { points: ptsStr(pts), class: cls }, parent); }
function box(parent, u0, u1, v0, v1, z0, z1, tom) {
  const g = se('g', { class: 'p2-box p2-t-' + tom }, parent);
  poly(g, [P(u1, v0, z0), P(u1, v1, z0), P(u1, v1, z1), P(u1, v0, z1)], 'p2-f-r');
  poly(g, [P(u0, v1, z0), P(u1, v1, z0), P(u1, v1, z1), P(u0, v1, z1)], 'p2-f-l');
  poly(g, [P(u0, v0, z1), P(u1, v0, z1), P(u1, v1, z1), P(u0, v1, z1)], 'p2-f-t');
  return g;
}
function linha(parent, a, b, cls) { return se('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }, parent); }
/* plano vertical voltado para a frente da mesa: x segue o eixo u, y sobe */
function plano(parent, u, v, z) {
  const b = P(u, v, z);
  return se('g', { transform: `translate(${b[0]} ${b[1]}) skewY(${SKEW})` }, parent);
}
function lampada(parent, u, v) {
  const b = P(u, v, 34);
  se('circle', { cx: b[0] + 9, cy: b[1] - 25, r: 22, class: 'p2-halo' }, parent);
  se('ellipse', { cx: b[0], cy: b[1], rx: 9, ry: 4.5, class: 'p2-prop-shade' }, parent);
  linha(parent, b, [b[0] + 4, b[1] - 30], 'p2-prop-line');
  se('path', { d: `M${b[0] - 6} ${b[1] - 28} L${b[0] + 18} ${b[1] - 24} L${b[0] + 12} ${b[1] - 40} Z`, class: 'p2-prop-shade' }, parent);
  se('circle', { cx: b[0] + 9, cy: b[1] - 25, r: 3.5, class: 'p2-bulb' }, parent);
}
function telefone(parent, u, v) {
  box(parent, u, u + 0.2, v, v + 0.17, 34, 41, 'ink');
  box(parent, u + 0.01, u + 0.19, v + 0.01, v + 0.05, 41, 45, 'ink');
  const c = P(u + 0.1, v + 0.09, 42);
  se('circle', { cx: c[0], cy: c[1], r: 3, class: 'p2-prop-bulb' }, parent);
}
function pilhaPastas(parent, u, v, n = 3) {
  const tons = ['wood', 'paper', 'wood', 'paper'];
  for (let i = 0; i < n; i++) box(parent, u, u + 0.3, v, v + 0.22, 34 + i * 4, 38 + i * 4, tons[i % 4]);
}
/* adereços fixos de cada tipo. Atrás: antes da figura. Sobre a mesa: depois do tampo. A luminária é comum a todos. */
function adereco(tipo) {

      return { atras(g) {

        for (let i = 0; i < 3; i++) {

          poly(g, [P(-0.27, -0.46, z), P(-0.27, -0.16, z), P(-0.27, -0.16, z + 15), P(-0.27, -0.46, z + 15)], 'p2-prop-shade');
          linha(g, P(-0.27, -0.36, z + 8), P(-0.27, -0.26, z + 8), 'p2-prop-line');

        box(g, 0.18, 0.4, -0.24, -0.02, 34, 38, 'carbon');

      return { sobre(g) { pilhaPastas(g, -0.26, -0.26, 3); telefone(g, 0.2, -0.24); } };

/* ---------- planejamento: grade, escala e rótulos escolhidos juntos ---------- */
const PAD = 8;           // folga da cena, em px

/* extensão da figura (mesa, adereços, marcador e, se houver, o carimbo) em unidades, relativa à âncora da mesa */
function extFig(k, slam) {
  let x0 = -80, x1 = 112, y0 = -(151 + 34 * k);
  if (slam) { x0 = Math.min(x0, 2 - 78 * k - 6); x1 = Math.max(x1, 10 + 78 * k + 6); y0 = Math.min(y0, -52 - 28 * k); }
  return { x0, x1, y0, y1: 52 };
}
function geometria(n, C, R, passo, compacto, W, H, f = 1) {
  const m = 0.7, parede = compacto ? 70 : 110;

  const pts = [];
  for (let k = 0; k < n; k++) {
    const a = k % C, b = Math.floor(k / C);
    pts.push({ a, b, u: passo * a, v: passo * b, X: gx(passo * a, passo * b), Y: gy(passo * a, passo * b) });
  }
  let k = 1, s = 0.2, e = null, bx = null;
  for (let it = 0; it < 4; it++) {
    e = extFig(k, !compacto);
    let x0 = gx(umin, vmax), x1 = gx(umax, vmin), y0 = gy(umin, vmin, parede), y1 = gy(umax, vmax);
    for (const p of pts) { x0 = Math.min(x0, p.X + e.x0); x1 = Math.max(x1, p.X + e.x1); y0 = Math.min(y0, p.Y + e.y0); y1 = Math.max(y1, p.Y + e.y1); }

    const novo = compacto ? clamp(0.65 / s, 1, 3.4) : clamp(0.55 / s, 1, 2.4);
    if (Math.abs(novo - k) < 0.04) break;

    const rot = tipo === 'devolucao' ? Math.sin(t * 20) * 14 : (e - 0.5) * 24;

}

/* ============================================================ eventos */
document.addEventListener('click', (e) => {
  const ex = e.target.closest('[data-p2-exec]');
  if (ex) { abrirExecucao(ex.getAttribute('data-p2-exec')); return; }
  if (e.target.closest('#p2-voltar')) { voltarLista(); return; }
  const txt = e.target.closest('.p2-log__txt');
  if (txt) { txt.setAttribute('aria-expanded', String(txt.getAttribute('aria-expanded') !== 'true')); return; }
  const rev = e.target.closest('[data-rever]');
  if (rev) {
    const f = app.estado && app.estado.falas.find((x) => x.id === rev.getAttribute('data-rever'));
    if (f) { app.fila.unshift(f); esvaziarFila(); }
    return;
  }
  const alvo = e.target.closest('button[data-p2-posto], [data-p2-posto]');
  if (!alvo || dlg.contains(alvo)) return;
  opener = alvo.matches('button') ? alvo : null;
  abrirPosto(alvo.getAttribute('data-p2-posto'));
});
$('#p2-filtro').addEventListener('change', (e) => { app.filtro = e.target.value; filtrarLog(); });
const botaoTema = $('#p2-tema');
const NOME_TEMA = { sistema: 'Sistema', claro: 'Claro', escuro: 'Escuro' };
function rotuloTema() { botaoTema.textContent = 'Tema: ' + NOME_TEMA[kit.temaAtual ? kit.temaAtual() : 'sistema']; }
botaoTema.addEventListener('click', () => { kit.tema(); rotuloTema(); });
rotuloTema();
/* ============================================================ fluxo de dados */
function aoEstado(est, info) {
  app.exemplo = !!(info && info.exemplo);
  app.estado = est;
  app.execPorId = new Map(est.agentes.map((a) => [a.id, a]));
  app.execPosto = new Map(est.agentes.map((a) => [a.id, tipoDe(a)]));
  app.porOriginal = new Map(est.agentes.map((a) => [a.tipoOriginal || a.tipo, tipoDe(a)]));
  const postos = montarPostos(est.agentes);
  atualizarTotais(est, postos);
  atualizarCena();
  atualizarQuadro(est);
  atualizarFiltro(postos);
  const primeira = app.anteriorN < 0;
  const { novas, encolheu } = atualizarLog(est);
  if (primeira) { novas.forEach((f) => app.vistas.add(f.id)); }
  else {
    const reanimar = encolheu ? est.falas : novas;
    for (const f of reanimar) { if (!app.vistas.has(f.id)) { app.vistas.add(f.id); app.fila.push(f); } }
    esvaziarFila();
  }
  app.anteriorN = est.falas.length;
  if (app.aberto && dlg.open && !app.aberto.exec) pintarPosto(app.aberto.tipo);
}
kit.conectar(aoEstado);

let rafRe = 0, ultimaDim = '';
new ResizeObserver(() => {
  const dim = cenaWrap.clientWidth + 'x' + cenaWrap.clientHeight;
  if (dim === ultimaDim) return; ultimaDim = dim;
  cancelAnimationFrame(rafRe);
  rafRe = requestAnimationFrame(() => { if (app.estado) atualizarCena(); });
}).observe(cenaWrap);
</script>
</body>
